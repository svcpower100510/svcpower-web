<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- 绿色背景 -->
  <rect width="400" height="500" rx="20" fill="#07c160"/>
  <!-- 顶部文字 -->
  <text x="200" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" font-family="sans-serif">推荐使用微信支付</text>
  
  <!-- 白色二维码区域 -->
  <rect x="50" y="80" width="300" height="300" rx="12" fill="#ffffff"/>
  
  <!-- 模拟二维码图案（装饰性） -->
  <g transform="translate(65,95)">
    <!-- 左上角定位图案 -->
    <rect width="40" height="40" fill="none" stroke="#000" stroke-width="3"/>
    <rect x="6" y="6" width="28" height="28" fill="#000"/>
    <rect x="12" y="12" width="16" height="16" fill="#fff"/>
    <rect x="16" y="16" width="8" height="8" fill="#000"/>
    
    <!-- 右上角定位图案 -->
    <g transform="translate(190,0)">
      <rect width="40" height="40" fill="none" stroke="#000" stroke-width="3"/>
      <rect x="6" y="6" width="28" height="28" fill="#000"/>
      <rect x="12" y="12" width="16" height="16" fill="#fff"/>
      <rect x="16" y="16" width="8" height="8" fill="#000"/>
    </g>
    
    <!-- 左下角定位图案 -->
    <g transform="translate(0,190)">
      <rect width="40" height="40" fill="none" stroke="#000" stroke-width="3"/>
      <rect x="6" y="6" width="28" height="28" fill="#000"/>
      <rect x="12" y="12" width="16" height="16" fill="#fff"/>
      <rect x="16" y="16" width="8" height="8" fill="#000"/>
    </g>
    
    <!-- 中心图标区域 -->
    <g transform="translate(80,80)">
      <!-- 两个动漫角色剪影 -->
      <circle cx="30" cy="30" r="20" fill="#333"/>
      <circle cx="50" cy="25" r="18" fill="#666"/>
      <!-- 绿色对勾圆 -->
      <circle cx="60" cy="55" r="12" fill="#07c160"/>
      <polyline points="55,55 59,59 66,51" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- 随机数据点 -->
    <g fill="#000">
      <rect x="55" y="10" width="6" height="6"/>
      <rect x="70" y="15" width="6" height="6"/>
      <rect x="85" y="8" width="6" height="6"/>
      <rect x="100" y="20" width="6" height="6"/>
      <rect x="115" y="12" width="6" height="6"/>
      <rect x="130" y="18" width="6" height="6"/>
      <rect x="145" y="10" width="6" height="6"/>
      <rect x="160" y="22" width="6" height="6"/>
      <rect x="10" y="55" width="6" height="6"/>
      <rect x="20" y="65" width="6" height="6"/>
      <rect x="35" y="60" width="6" height="6"/>
      <rect x="50" y="70" width="6" height="6"/>
      <rect x="120" y="55" width="6" height="6"/>
      <rect x="135" y="65" width="6" height="6"/>
      <rect x="150" y="60" width="6" height="6"/>
      <rect x="165" y="70" width="6" height="6"/>
      <rect x="55" y="120" width="6" height="6"/>
      <rect x="70" y="130" width="6" height="6"/>
      <rect x="85" y="125" width="6" height="6"/>
      <rect x="100" y="135" width="6" height="6"/>
      <rect x="115" y="128" width="6" height="6"/>
      <rect x="130" y="138" width="6" height="6"/>
      <rect x="145" y="120" width="6" height="6"/>
      <rect x="160" y="132" width="6" height="6"/>
      <rect x="10" y="100" width="6" height="6"/>
      <rect x="25" y="110" width="6" height="6"/>
      <rect x="40" y="105" width="6" height="6"/>
      <rect x="170" y="100" width="6" height="6"/>
      <rect x="180" y="110" width="6" height="6"/>
      <rect x="55" y="170" width="6" height="6"/>
      <rect x="75" y="165" width="6" height="6"/>
      <rect x="95" y="175" width="6" height="6"/>
      <rect x="115" y="168" width="6" height="6"/>
      <rect x="135" y="172" width="6" height="6"/>
      <rect x="155" y="165" width="6" height="6"/>
      <rect x="175" y="178" width="6" height="6"/>
    </g>
  </g>
  
  <!-- 底部收款人信息 -->
  <text x="200" y="410" text-anchor="middle" font-size="14" fill="#ffffff" font-family="sans-serif">rosvcliny.odm.dsl(*方)</text>
  
  <!-- 底部微信支付标识 -->
  <rect x="80" y="440" width="240" height="40" rx="8" fill="#ffffff"/>
  <!-- 微信图标 -->
  <circle cx="110" cy="460" r="14" fill="#07c160"/>
  <text x="110" y="465" text-anchor="middle" font-size="16" fill="#fff" font-family="sans-serif">✓</text>
  <text x="200" y="465" text-anchor="middle" font-size="18" fill="#333" font-family="sans-serif" font-weight="bold">微信支付</text>
</svg>
